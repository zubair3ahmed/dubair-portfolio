<svg viewBox="0 0 600 360" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes coverPulse{0%{offset-distance:0%;opacity:0}15%{opacity:1}85%{opacity:1}100%{offset-distance:100%;opacity:0}}
    .cp{r:2.5;fill:#E4FE9A;opacity:0;offset-rotate:0deg;animation:coverPulse 2.2s ease-in-out infinite}
    @keyframes nodeGlow{0%,100%{filter:drop-shadow(0 0 4px rgba(228,254,154,.15))}50%{filter:drop-shadow(0 0 10px rgba(228,254,154,.3))}}
    .chief-ring{animation:nodeGlow 3s ease infinite}
  </style>
  <rect width="600" height="360" fill="#0a0a0a"/>

  <!-- Owner node -->
  <rect x="225" y="20" width="150" height="40" rx="10" fill="#111" stroke="rgba(255,255,255,.08)"/>
  <text x="300" y="44" text-anchor="middle" fill="#fff" font-size="10" font-family="ui-monospace,SFMono-Regular,monospace" opacity=".7">Business Owner</text>

  <!-- Owner → Chief line -->
  <path id="cpO" d="M300,60 L300,95" stroke="rgba(255,255,255,.08)" fill="none"/>
  <circle class="cp" style="animation-delay:0s"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#cpO"/></animateMotion></circle>

  <!-- Chief node -->
  <g class="chief-ring">
    <rect x="200" y="95" width="200" height="50" rx="12" fill="rgba(228,254,154,.06)" stroke="#E4FE9A" stroke-opacity=".6"/>
  </g>
  <text x="300" y="125" text-anchor="middle" fill="#E4FE9A" font-size="10" font-family="ui-monospace,SFMono-Regular,monospace" font-weight="700" opacity=".9">CHIEF OF STAFF</text>

  <!-- Chief → Row 1 lines -->
  <path id="cp1" d="M240,145 L240,160 Q240,175 130,195 L130,210" stroke="rgba(251,191,36,.25)" fill="none"/>
  <path id="cp2" d="M300,145 L300,210" stroke="rgba(94,234,212,.25)" fill="none"/>
  <path id="cp3" d="M360,145 L360,160 Q360,175 470,195 L470,210" stroke="rgba(200,180,255,.25)" fill="none"/>

  <!-- Chief → Row 2 lines -->
  <path id="cp4" d="M240,145 L240,160 Q240,180 130,270 L130,285" stroke="rgba(251,113,133,.25)" fill="none"/>
  <path id="cp5" d="M300,145 L300,285" stroke="rgba(96,165,250,.25)" fill="none"/>
  <path id="cp6" d="M360,145 L360,160 Q360,180 470,270 L470,285" stroke="rgba(228,254,154,.25)" fill="none"/>

  <!-- Animated pulses -->
  <circle class="cp" style="animation-delay:0s"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#cp1"/></animateMotion></circle>
  <circle class="cp" style="animation-delay:.35s"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#cp2"/></animateMotion></circle>
  <circle class="cp" style="animation-delay:.7s"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#cp3"/></animateMotion></circle>
  <circle class="cp" style="animation-delay:1.05s"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#cp4"/></animateMotion></circle>
  <circle class="cp" style="animation-delay:1.4s"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#cp5"/></animateMotion></circle>
  <circle class="cp" style="animation-delay:1.75s"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#cp6"/></animateMotion></circle>

  <!-- Row 1 agent nodes -->
  <rect x="80" y="210" width="100" height="44" rx="10" fill="#111" stroke="#fbbf24" stroke-opacity=".3"/>
  <text x="130" y="228" text-anchor="middle" fill="#fff" font-size="14" font-family="system-ui">🎨</text>
  <text x="130" y="245" text-anchor="middle" fill="#fbbf24" font-size="8" font-family="ui-monospace,SFMono-Regular,monospace" opacity=".8">Storefront</text>

  <rect x="250" y="210" width="100" height="44" rx="10" fill="#111" stroke="#5eead4" stroke-opacity=".3"/>
  <text x="300" y="228" text-anchor="middle" fill="#fff" font-size="14" font-family="system-ui">📣</text>
  <text x="300" y="245" text-anchor="middle" fill="#5eead4" font-size="8" font-family="ui-monospace,SFMono-Regular,monospace" opacity=".8">Marketing</text>

  <rect x="420" y="210" width="100" height="44" rx="10" fill="#111" stroke="#c8b4ff" stroke-opacity=".3"/>
  <text x="470" y="228" text-anchor="middle" fill="#fff" font-size="14" font-family="system-ui">💬</text>
  <text x="470" y="245" text-anchor="middle" fill="#c8b4ff" font-size="8" font-family="ui-monospace,SFMono-Regular,monospace" opacity=".8">Support</text>

  <!-- Row 2 agent nodes -->
  <rect x="80" y="285" width="100" height="44" rx="10" fill="#111" stroke="#fb7185" stroke-opacity=".3"/>
  <text x="130" y="303" text-anchor="middle" fill="#fff" font-size="14" font-family="system-ui">📦</text>
  <text x="130" y="320" text-anchor="middle" fill="#fb7185" font-size="8" font-family="ui-monospace,SFMono-Regular,monospace" opacity=".8">Operations</text>

  <rect x="250" y="285" width="100" height="44" rx="10" fill="#111" stroke="#60a5fa" stroke-opacity=".3"/>
  <text x="300" y="303" text-anchor="middle" fill="#fff" font-size="14" font-family="system-ui">📊</text>
  <text x="300" y="320" text-anchor="middle" fill="#60a5fa" font-size="8" font-family="ui-monospace,SFMono-Regular,monospace" opacity=".8">Analytics</text>

  <rect x="420" y="285" width="100" height="44" rx="10" fill="#111" stroke="#E4FE9A" stroke-opacity=".3"/>
  <text x="470" y="303" text-anchor="middle" fill="#fff" font-size="14" font-family="system-ui">🌸</text>
  <text x="470" y="320" text-anchor="middle" fill="#E4FE9A" font-size="8" font-family="ui-monospace,SFMono-Regular,monospace" opacity=".8">Product</text>
</svg>
